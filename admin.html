<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">JR / admin</span>
      <div class="admin-actions">
        <span id="statut-sauvegarde" class="statut"></span>
        <button id="btn-importer" class="btn btn-outline">Importer data.json</button>
        <button id="btn-exporter" class="btn btn-accent">Exporter data.json</button>
      </div>
    </div>
  </header>

  <input type="file" id="fichier-import" accept="application/json" hidden>

  <main class="container admin-main">

    <p class="admin-note">
      Les modifications sont sauvegardées localement dans ce navigateur au fur et à mesure.
      Pour les publier sur le site, clique sur <strong>Exporter data.json</strong>, puis remplace
      le fichier dans le dépôt et push.
    </p>

    <section class="admin-section">
      <h2>Profil</h2>
      <form id="form-profil" class="form-grid">
        <label>Prénom <input type="text" name="prenom"></label>
        <label>Nom <input type="text" name="nom"></label>
        <label class="span-2">Titre <input type="text" name="titre"></label>
        <label class="span-2">Résumé <textarea name="resume" rows="4"></textarea></label>
        <label>Email <input type="email" name="email"></label>
        <label>Localisation <input type="text" name="localisation"></label>
        <label class="span-2">GitHub <input type="url" name="github"></label>
        <label class="span-2">Téléphones (séparés par une virgule)
          <input type="text" name="telephones">
        </label>
      </form>
    </section>

    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Compétences</h2>
        <button class="btn btn-outline" data-action="ajouter-competence">+ Catégorie</button>
      </div>
      <div id="admin-competences"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Expériences</h2>
        <button class="btn btn-outline" data-action="ajouter-experience">+ Expérience</button>
      </div>
      <div id="admin-experiences"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Formations</h2>
        <button class="btn btn-outline" data-action="ajouter-formation">+ Formation</button>
      </div>
      <div id="admin-formations"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-header">
        <h2>Langues</h2>
        <button class="btn btn-outline" data-action="ajouter-langue">+ Langue</button>
      </div>
      <div id="admin-langues"></div>
    </section>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
