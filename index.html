<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joan Rayn Domtchueng Foubi — Portfolio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">JR</span>
      <nav class="main-nav">
        <ul>
          <li><a href="#profil">Profil</a></li>
          <li><a href="#competences">Compétences</a></li>
          <li><a href="#experiences">Expériences</a></li>
          <li><a href="#formations">Formation</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main>

    <section id="profil" class="hero">
      <div class="container">
        <h1 id="profil-nom"></h1>
        <p id="profil-titre" class="subtitle"></p>
        <p id="profil-resume" class="resume"></p>
        <div class="contact-quick">
          <span id="profil-localisation"></span>
          <a id="profil-github" href="#" target="_blank">GitHub</a>
        </div>
      </div>
    </section>

    <section id="competences" class="section">
      <div class="container">
        <h2>Compétences</h2>
        <div id="competences-list" class="competences-grid">
          <!-- généré dynamiquement : une carte par catégorie -->
        </div>
      </div>
    </section>

    <section id="experiences" class="section">
      <div class="container">
        <h2>Expériences professionnelles</h2>
        <div id="experiences-list" class="timeline">
          <!-- généré dynamiquement : une entrée par expérience -->
        </div>
      </div>
    </section>

    <section id="formations" class="section">
      <div class="container">
        <h2>Formation</h2>
        <div id="formations-list" class="timeline">
          <!-- généré dynamiquement -->
        </div>
      </div>
    </section>

    <section id="langues" class="section">
      <div class="container">
        <h2>Langues</h2>
        <ul id="langues-list" class="langues-list">
          <!-- généré dynamiquement -->
        </ul>
      </div>
    </section>

    <section id="contact" class="section contact-section">
      <div class="container">
        <h2>Contact</h2>
        <ul id="contact-list" class="contact-list">
          <!-- email + téléphones générés dynamiquement -->
        </ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="annee-courante"></span> Joan Rayn Domtchueng Foubi<span id="admin-access" class="admin-access" role="link" tabindex="0" aria-label="Accès admin"> a</span></p>    
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
